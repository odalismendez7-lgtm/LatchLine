# LOCAL-ONLY config for the real Cloudflare runtime on your own computer (`wrangler dev --local`).
# VERIFIED 2026-11-21 with wrangler 4.166.0 / workerd 2026-11-19 (docs/RUNTIME_VALIDATION.md); used by tests/workerd.runtime.test.mjs.
# `--local` uses a local file-backed D1 and does NOT contact Cloudflare, create a remote database, log in, or deploy.
# Never deploy with this file: it switches on the MOCK-mail dashboard. Do not put secrets in it.
name = "latchline-local"
main = "src/index.js"
compatibility_date = "2026-11-16"

[[d1_databases]]
binding = "DB"
database_name = "latchline-local"
# Placeholder only. A real id would come from creating a REMOTE database, which needs founder approval. Do not create one.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Local-only values. The salt is not a secret here; production must use a real secret (wrangler secret put).
RATE_LIMIT_SALT = "local-dev-only-salt-change-me"
# Switches the dashboard and account routes ON with the MOCK mailer (nothing is ever sent).
LATCHLINE_ACCOUNTS = "mock-local"
LATCHLINE_DEV_MAILBOX = "1"
