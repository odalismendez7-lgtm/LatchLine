# LOCAL-ONLY probe configuration. Run with `wrangler dev --local` only. Never deploy this.
# No account, no remote database: the all-zero database_id is a placeholder and --local never contacts Cloudflare.
name = "latchline-probe"
main = "worker.js"
compatibility_date = "2026-11-16"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "latchline-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../migrations"
