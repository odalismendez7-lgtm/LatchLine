name: Tests
on:
  push:
    branches: ["main", "stage-6-runtime-validation", "codex/latchline-completion"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Build and commit the generated widget bundle for same-repository pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          node scripts/build-widget.mjs
          if git diff --quiet -- src/widget/widget.bundle.js; then
            echo "Widget bundle is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/widget/widget.bundle.js
          git commit -m "Build widget bundle"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Install Playwright and Chromium for real widget browser tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: npm test
