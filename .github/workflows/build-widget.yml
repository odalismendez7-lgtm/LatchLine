name: Build widget bundle

on:
  push:
    branches: ["codex/latchline-completion"]
    paths:
      - "src/widget/widget.src.js"
      - ".github/workflows/build-widget.yml"

permissions:
  contents: write

concurrency:
  group: latchline-widget-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/latchline-completion
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: node scripts/build-widget.mjs
      - name: Commit generated bundle when changed
        run: |
          if git diff --quiet -- src/widget/widget.bundle.js; then
            echo "Widget bundle is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/widget/widget.bundle.js
          git commit -m "Build widget bundle"
          git push origin HEAD:codex/latchline-completion
