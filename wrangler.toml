
name = "latchline"
main = "src/index.js"
compatibility_date = "2026-11-16"

# Retries and recovery for the notification outbox. Only takes effect if the Worker is deployed
# (not done; needs founder approval). Cron triggers are available on the free plan.
[triggers]
crons = ["*/5 * * * *"]

# Workers AI binding is available but NOT enabled as the provider unless
# LATCHLINE_AI_PROVIDER="workers-ai" is explicitly set in Worker vars.
# The default provider remains the mock; no inference is run by this binding alone.
[[ai]]
binding = "AI"
